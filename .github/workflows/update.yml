name: update-tvbox-index

# 每天 UTC 20:10（北京时间 04:10）自动重建：
#   发现新仓库 → 抓取 → 去重 → 探测剔除失效 → 生成配置 → 发布到 dist 分支
on:
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      max_urls:
        description: "本轮最多抓取多少 URL"
        default: "8000"
      budget:
        description: "抓取时间预算（秒）"
        default: "1800"

permissions:
  contents: write

concurrency:
  group: tvbox-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 发现新仓库并只拉配置文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/gh_discover.py search || true
          python tools/gh_pull.py --max-repos 80 --max-files 100 --workers 8 || true
          echo "本地配置仓库: $(ls sources 2>/dev/null | wc -l) 个"

      - name: 收集候选源
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tvh discover

      - name: 抓取与解析
        env:
          MAX_URLS: ${{ inputs.max_urls || '8000' }}
          BUDGET: ${{ inputs.budget || '1800' }}
        run: >-
          python -m tvh crawl --max-urls "$MAX_URLS" --workers 64
          --per-host 8 --timeout 12 --budget "$BUDGET"

      - name: 去重 + 探测 + 生成
        run: python -m tvh build --workers 96 --timeout 8 --jar-top 30

      - name: 校验与报告
        run: |
          python tools/validate.py --all || true
          python tools/report.py

      - name: 发布到 dist 分支（单提交，不涨仓库体积）
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp dist/*.json /tmp/pub/
          cp docs/aggregation-report.md /tmp/pub/REPORT.md
          cd /tmp/pub
          git init -q -b dist
          git add -A
          git commit -q -m "build: $(date -u +%FT%TZ) / $(python -c 'import json;d=json.load(open("index.json"));print(len(d["sites"]))') sites"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist:dist
          echo "已发布：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/dist/index.json"

      - name: 汇总
        run: |
          python - <<'PY'
          import json
          s = json.load(open("dist/stats.json", encoding="utf-8"))
          idx = json.load(open("dist/index.json", encoding="utf-8"))
          lines = ["## 本次构建", "",
                   f"- 站点：{len(idx['sites'])}",
                   f"- 解析器：{len(idx.get('parses') or [])}",
                   f"- 直播源：{len(idx.get('lives') or [])}",
                   f"- spider：`{idx.get('spider','')}`"]
          for k in ("probe", "dup", "raw_sites", "docs"):
              if k in s:
                  lines.append(f"- {k}: `{json.dumps(s[k], ensure_ascii=False)[:300]}`")
          lines += ["", "```",
                    "https://raw.githubusercontent.com/" + __import__("os").environ["GITHUB_REPOSITORY"] + "/dist/index.json",
                    "https://cdn.jsdelivr.net/gh/" + __import__("os").environ["GITHUB_REPOSITORY"] + "@dist/index.json",
                    "```"]
          open("/tmp/summary.md", "w", encoding="utf-8").write("\n".join(lines))
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"
